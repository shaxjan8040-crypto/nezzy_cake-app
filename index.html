<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezzy Cake Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .hidden {
            display: none;
        }
        h1 {
            color: #ff69b4;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            outline: none;
            margin-top: 10px;
        }
        .btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Video / Reklama qismi -->
    <div id="video-section">
        <h2>📢 Nezzy_cake Yangiliklari</h2>
        <video id="promoVideo" controls playsinline autoplay>
            <source src="Shaxzod.MOV" type="video/mp4">
            Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
        </video>
        <br>
        <button class="btn" onclick="skipVideo()">O'tkazib yuborish ➔</button>
    </div>

    <!-- Asosiy menyu (video tugagach yoki o'tkazib yuborilganda chiqadi) -->
    <div id="main-section" class="hidden">
        <h1>🍰 Nezzy_cake</h1>
        <p>Shirinliklar olamiga xush kelibsiz!</p>
        <button class="btn" onclick="sendMessage()">Buyurtma berish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let video = document.getElementById("promoVideo");
        
        // Video tugaganda avtomatik asosiy menyuga o'tish
        video.onended = function() {
            skipVideo();
        };

        function skipVideo() {
            document.getElementById("video-section").style.display = "none";
            document.getElementById("main-section").style.display = "block";
        }

        function sendMessage() {
            tg.sendData("Salom, men mini app orqali buyurtma bermoqchiman!");
        }
    </script>

</body>
</html>
