<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezzy Cake Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        #video-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Videoni boshlash uchun chiroyli tugma */
        .play-btn {
            position: relative;
            z-index: 10000;
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }
        #main-section {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: #121212;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #ff69b4;
            margin-top: 50px;
        }
        .btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="video-section">
        <!-- AGAR VIDESINGIZ MP4 BO'LSA MANZILNI O'ZGARTIRING -->
        <video id="promoVideo" playsinline>
            <source src="https://cdn.storagetobox.com/b17ffa48-8878-4670-a972-e1d20d60e23b?expires=1794761560&filename=Shaxzod.MOV&id=zFJzHs6To&sig=cf1c4ee78762c6b60e1da737ce70ca227f3f638e6e4dac5781bc8afcf33d3547" type="video/quicktime">
        </video>
        <!-- Foydalanuvchi bosishi uchun boshlash tugmasi -->
        <button class="play-btn" onclick="startVideo()">▶️ Ilovani ochish</button>
    </div>

    <div id="main-section">
        <h1>🍰 Nezzy_cake</h1>
        <p>Shirinliklar olamiga xush kelibsiz!</p>
        <button class="btn" onclick="sendMessage()">Buyurtma berish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let video = document.getElementById("promoVideo");
        let playBtn = document.querySelector(".play-btn");

        function startVideo() {
            playBtn.style.display = "none"; // Tugmani yashirish
            video.play(); // Videoni ovoz bilan boshlash
        }

        // Video tugaganda asosiy menyuni ochish
        video.onended = function() {
            document.getElementById("video-section").style.display = "none";
            document.getElementById("main-section").style.display = "block";
        };

        function sendMessage() {
            tg.sendData("Salom, men mini app orqali buyurtma bermoqchiman!");
        }
    </script>

</body>
</html>
