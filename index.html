<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nezzy Cake Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ff69b4;
        }
        .btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🍰 Nezzy_cake</h1>
    <p>Shirinliklar olamiga xush kelibsiz!</p>
    
    <button class="btn" onclick="sendMessage()">Buyurtma berish</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendMessage() {
            tg.sendData("Salom, men mini app orqali buyurtma bermoqchiman!");
        }
    </script>

</body>
</html>
